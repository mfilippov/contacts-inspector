name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # для публикации релиза по тегу

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Кэш пакетов SwiftPM: сборка TDLib весит ~360 МБ, не качаем её каждый раз
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Toolchain
        run: swift --version

      - name: Tests
        run: swift test

      - name: Build app
        env:
          # Settings → Secrets and variables → Actions
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: ./build-app.sh

      - name: Package
        run: ditto -c -k --keepParent "build/Contacts Inspector.app" build/Contacts-Inspector.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Contacts-Inspector
          path: build/Contacts-Inspector.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Contacts-Inspector.zip
